name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs nothing from GitHub beyond reading the code.
permissions:
  contents: read

concurrency:
  # Never two deploys at once: the switch is atomic, but two overlapping restarts
  # are not.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://atgreen.hpc4ai.unito.it/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gates as CI. A push to main runs both workflows; this repeats them
      # rather than trusting a parallel run, because a deploy that skipped its own
      # checks is a deploy that can ship a red build.
      - name: Format check
        run: npx prettier --check .

      - name: Lint and typecheck (ratchet)
        run: npm run check:ratchet

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Assemble the release tarball
        # adapter-node externalises everything in `dependencies`, so build/ alone
        # cannot serve the routes that use them — the release must carry its own
        # production node_modules. Verified: without them, / returns 500 while
        # /about returns 200, which is exactly the partial failure a shallow smoke
        # test misses.
        run: |
          rm -rf release && mkdir release
          cp -r build release/build
          cp package.json package-lock.json release/
          (cd release && npm ci --omit=dev --no-audit --no-fund)
          tar -czf release.tgz -C release .
          ls -lh release.tgz

      - name: Ship it
        # The key is locked to a forced command on the server (see docs/DEPLOY.md),
        # so it cannot run anything but the receiver. The receiver smoke-tests the
        # new release on a spare port, switches the symlink, restarts, verifies the
        # public URL and rolls back on its own if that fails.
        env:
          DEPLOY_KEY: ${{ secrets.ATGREEN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ATGREEN_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::ATGREEN_DEPLOY_KEY / ATGREEN_SSH_KNOWN_HOSTS are not set — see docs/DEPLOY.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@ghsci.hpc4ai.unito.it "${GITHUB_SHA}" < release.tgz

      - name: Confirm the deployed release is the committed one
        run: |
          sleep 5
          deployed="$(curl -sS --max-time 20 https://atgreen.hpc4ai.unito.it/ -o /dev/null -w '%{http_code}')"
          [ "$deployed" = "200" ] || { echo "::error::public URL returned $deployed"; exit 1; }
          echo "Deployed ${GITHUB_SHA::8}"

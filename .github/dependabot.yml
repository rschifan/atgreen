version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen: this tree is several majors behind,
      # so ungrouped updates would bury everything else.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Every major is a deliberate migration tracked in the remediation plan, not
      # something to take piecemeal from a bot: prettier 3 reformats the whole tree,
      # vitest 5 and turf 7 change APIs, and svelte/kit/vite move together or not at
      # all. Minor and patch updates still flow through the groups above.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Carbon's minors have shipped breaking DOM changes before - the 0.76 to 0.112
      # tooltip rewrite is what broke this site's homepage - so they are opt-in too.
      - dependency-name: carbon-components-svelte
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

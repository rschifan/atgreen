version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen: this tree is several majors behind,
      # so ungrouped updates would bury everything else.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors are deliberate migrations, tracked in the remediation plan, not
      # something to take piecemeal from a bot.
      - dependency-name: svelte
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/kit'
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: carbon-components-svelte
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: mapbox-gl
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
